name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  kiosk-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Decode the signing keystore
        env:
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KIOSK_KEYSTORE_BASE64" ]; then
            echo "Secret KIOSK_KEYSTORE_BASE64 is not set. See RELEASE.md."
            exit 1
          fi
          echo "$KIOSK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiosk-release.jks"

      - name: Test and build the signed release APK
        working-directory: android
        env:
          KIOSK_KEYSTORE_FILE: ${{ runner.temp }}/kiosk-release.jks
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease

      - name: Attach the APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dragon-touch-kiosk-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
